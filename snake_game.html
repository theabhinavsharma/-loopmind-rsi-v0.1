<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake '95 - Classic Snake Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: #00ff00;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 1px 1px, rgba(0,255,0,0.1) 1px, transparent 0);
            background-size: 20px 20px;
        }

        .game-container {
            text-align: center;
            border: 3px solid #00ff00;
            border-radius: 10px;
            padding: 20px;
            background: #000;
            box-shadow: 
                0 0 20px #00ff00,
                inset 0 0 20px rgba(0,255,0,0.1);
        }

        h1 {
            font-size: 24px;
            margin: 0 0 20px 0;
            text-shadow: 0 0 10px #00ff00;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #00ff00; }
            to { text-shadow: 0 0 20px #00ff00, 0 0 30px #00ff00; }
        }

        canvas {
            border: 2px solid #00ff00;
            background: #001100;
            box-shadow: inset 0 0 10px rgba(0,255,0,0.2);
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            font-size: 14px;
        }

        .controls {
            margin-top: 20px;
            font-size: 10px;
            color: #00cc00;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            border: 2px solid #ff0000;
            padding: 20px;
            text-align: center;
            color: #ff0000;
            display: none;
        }

        .game-over h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }

        .game-over p {
            margin: 5px 0;
            font-size: 10px;
        }

        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #00cc00;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>SNAKE '95</h1>
        <div class="score-board">
            <div>SCORE: <span id="score">0</span></div>
            <div>HIGH SCORE: <span id="highScore">0</span></div>
            <div>LENGTH: <span id="length">1</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            USE ARROW KEYS TO MOVE<br>
            PRESS SPACE TO PAUSE<br>
            EAT THE RED SQUARES TO GROW
        </div>
    </div>

    <div id="gameOver" class="game-over">
        <h2>GAME OVER</h2>
        <p>FINAL SCORE: <span id="finalScore">0</span></p>
        <p>FINAL LENGTH: <span id="finalLength">0</span></p>
        <button onclick="restartGame()">PLAY AGAIN</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const lengthElement = document.getElementById('length');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const finalLengthElement = document.getElementById('finalLength');

        // Game settings
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            {x: 10, y: 10}
        ];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let gamePaused = false;

        // Update high score display
        highScoreElement.textContent = highScore;

        function randomFoodPosition() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        }

        function drawGame() {
            // Clear canvas with retro scan lines effect
            ctx.fillStyle = '#001100';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw scan lines
            ctx.fillStyle = 'rgba(0, 255, 0, 0.05)';
            for (let y = 0; y < canvas.height; y += 2) {
                ctx.fillRect(0, y, canvas.width, 1);
            }

            // Draw snake
            ctx.fillStyle = '#00ff00';
            ctx.shadowColor = '#00ff00';
            ctx.shadowBlur = 5;
            
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Snake head - slightly brighter
                    ctx.fillStyle = '#00ff88';
                } else {
                    // Snake body - gradient effect
                    const alpha = 1 - (index * 0.05);
                    ctx.fillStyle = `rgba(0, 255, 0, ${Math.max(alpha, 0.3)})`;
                }
                
                ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, 
                           gridSize - 2, gridSize - 2);
                
                // Add pixel border effect
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.strokeRect(segment.x * gridSize + 1, segment.y * gridSize + 1, 
                             gridSize - 2, gridSize - 2);
            });

            // Draw food
            ctx.fillStyle = '#ff0000';
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 10;
            ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, 
                        gridSize - 4, gridSize - 4);
            
            // Food glow effect
            ctx.fillStyle = '#ff6666';
            ctx.fillRect(food.x * gridSize + 4, food.y * gridSize + 4, 
                        gridSize - 8, gridSize - 8);

            ctx.shadowBlur = 0;
        }

        function moveSnake() {
            if (!gameRunning || gamePaused) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Check wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Check self collision
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                lengthElement.textContent = snake.length;
                randomFoodPosition();
                
                // Check for new high score
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
            } else {
                snake.pop();
            }
        }

        function gameOver() {
            gameRunning = false;
            finalScoreElement.textContent = score;
            finalLengthElement.textContent = snake.length;
            gameOverElement.style.display = 'block';
        }

        function restartGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            lengthElement.textContent = snake.length;
            gameOverElement.style.display = 'none';
            randomFoodPosition();
            gameRunning = true;
            gamePaused = false;
        }

        function gameLoop() {
            moveSnake();
            drawGame();
        }

        // Controls
        document.addEventListener('keydown', (e) => {
            if (!gameRunning && e.key !== ' ') {
                if (e.key.startsWith('Arrow')) {
                    gameRunning = true;
                    gamePaused = false;
                }
            }

            switch (e.key) {
                case 'ArrowUp':
                    if (dy !== 1) { dx = 0; dy = -1; }
                    break;
                case 'ArrowDown':
                    if (dy !== -1) { dx = 0; dy = 1; }
                    break;
                case 'ArrowLeft':
                    if (dx !== 1) { dx = -1; dy = 0; }
                    break;
                case 'ArrowRight':
                    if (dx !== -1) { dx = 1; dy = 0; }
                    break;
                case ' ':
                    e.preventDefault();
                    if (gameRunning) {
                        gamePaused = !gamePaused;
                    }
                    break;
            }
        });

        // Initialize game
        randomFoodPosition();
        drawGame();

        // Game loop
        setInterval(gameLoop, 150); // 90s speed - not too fast, not too slow

        // Initial message
        setTimeout(() => {
            if (!gameRunning) {
                ctx.fillStyle = 'rgba(0, 255, 0, 0.8)';
                ctx.font = '14px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText('PRESS ANY ARROW KEY', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillText('TO START GAME', canvas.width / 2, canvas.height / 2 + 10);
            }
        }, 100);
    </script>
</body>
</html>
